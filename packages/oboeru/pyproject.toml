[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oboeru"
version = "0.5.0"
description = "Addictive terminal kanji quiz (TUI) on KANJIDIC2 data"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "textual>=8.2.8",
  "pillow>=12",
]

[project.scripts]
oboeru = "oboeru.app:main"

[tool.hatch.build]
# The KANJIDIC2 database is built into the package before `uv build`
# (see .github/workflows/oboeru-release.yml); bundle it as package data.
# The CJK font ships with the kanji art on every machine (OFL, see fonts/).
artifacts = [
  "src/oboeru/kanjidic2.sqlite",
  "src/oboeru/fonts/**",
]
